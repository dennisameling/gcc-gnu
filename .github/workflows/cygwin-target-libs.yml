# Cold bootstrap of the aarch64-pc-cygwin target libraries, driven by the
# upstream Windows-on-Arm build system rather than a hand-rolled sequence.
#
# NOT FOR UPSTREAM SUBMISSION.
#
# The sibling cygwin-cross workflow stops at "make all-gcc", so it never
# compiles a target object and never exercises the libgcc/config.host hunk
# in the "Add aarch64-pc-cygwin target" patch, which is where two real bugs
# were found by hand.
#
# Rather than reimplement the bootstrap, run the gnu-toolchain-windows-arm64
# build system and override only the two sources under test.  GCC and
# binutils come from this fork's branches; mingw-w64 and Cygwin keep the
# build system's own pins, so a green run is evidence about the GCC and
# binutils patches specifically.
#
# It runs from a branch of our fork of that build system, because its
# Cygwin autogen fixup only applies against one specific autoconf release.

name: cygwin target libraries

on:
  push:
    branches:
      - ci-target-libraries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target-libs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: aarch64-pc-cygwin toolchain
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 330
    env:
      # Target selection.
      ARCH: aarch64
      PLATFORM: pc-cygwin
      CRT: msvcrt

      # The two things under test.
      GCC_REPO: dennisameling/gcc-gnu
      GCC_BRANCH: aarch64-cygwin-trunk
      BINUTILS_REPO: dennisameling/binutils-gdb
      # Build against the target patch plus a revert of upstream 534e9a794
      # "PE+: Remove the stdcall fixup machinery", which lands on 2026-09-04
      # and breaks linking cygwin1.dll.  The aarch64-pc-cygwin branch carries
      # the upstreamable patch alone, against unmodified trunk.
      BINUTILS_BRANCH: aarch64-pc-cygwin-build
      # MINGW_REPO and CYGWIN_REPO deliberately left at the build
      # system's own defaults, which are a self-consistent set.

      # Build-system behaviour.
      RUN_BOOTSTRAP: 1      # install apt dependencies
      UPDATE_SOURCES: 1     # clone the source repositories
      REBASE_SOURCES: 0     # our branches sit on GNU trunk, not on woarm64
      FLAT_CLONE: 1
      CCACHE: 1
      DELETE_BUILD: 1       # runners only have ~14 GB of disk
      # Pin the install prefix.  The build system otherwise derives it, and
      # the collect steps looked in the wrong place.
      TOOLCHAIN_PATH: ${{ github.workspace }}/toolchain

    steps:
      - name: Check out the build system
        uses: actions/checkout@v7
        with:
          repository: dennisameling/gnu-toolchain-windows-arm64
          ref: fix-autogen-patch-portability
          path: build-system
          fetch-depth: 1

      - name: Free up disk space
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          df -h / | tail -1

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: build-system/ccache
          key: woarm64-ccache-${{ github.sha }}
          restore-keys: |
            woarm64-ccache-

      - name: Report the sources under test
        run: |
          echo "gcc:      $GCC_REPO@$GCC_BRANCH      $(git ls-remote https://github.com/$GCC_REPO.git refs/heads/$GCC_BRANCH | cut -f1)"
          echo "binutils: $BINUTILS_REPO@$BINUTILS_BRANCH  $(git ls-remote https://github.com/$BINUTILS_REPO.git refs/heads/$BINUTILS_BRANCH | cut -f1)"

      - name: Build the toolchain
        run: ./build-system/.github/scripts/build.sh

      - name: Collect results
        if: always()
        run: |
          set +e
          TC="$TOOLCHAIN_PATH"
          T="${ARCH}-${PLATFORM}"
          mkdir -p out/logs
          {
            echo "target:   $T"
            echo "gcc:      $GCC_REPO@$GCC_BRANCH"
            echo "binutils: $BINUTILS_REPO@$BINUTILS_BRANCH"
            echo "prefix:   $TC"
            echo
            echo "=== artefacts ==="
            for f in "$TC"/lib/gcc/$T/*/libgcc.a "$TC/$T/lib/libstdc++.a" \
                     "$TC/$T/lib/libcygwin.a" "$TC/bin/cygwin1.dll"; do
              if [ -f "$f" ]; then printf '%-16s %12s bytes\n' "$(basename "$f")" "$(stat -c %s "$f")"
              else printf '%-16s MISSING\n' "$(basename "$f")"; fi
            done
            echo
            echo "=== unwinder model in libgcc ==="
            for f in "$TC"/lib/gcc/$T/*/libgcc.a; do
              [ -f "$f" ] || continue
              echo "  _Unwind_SjLj_*:         $("$TC/bin/$T-nm" "$f" 2>/dev/null | grep -c '_Unwind_SjLj_')"
              echo "  _Unwind_RaiseException: $("$TC/bin/$T-nm" "$f" 2>/dev/null | grep -c 'T _Unwind_RaiseException')"
            done
          } > out/MANIFEST.txt 2>&1
          cat out/MANIFEST.txt
          df -h / | tail -1 > out/logs/disk.txt
          exit 0

      - name: Package the sysroot
        if: always()
        run: |
          set +e
          TC="$TOOLCHAIN_PATH"
          T="${ARCH}-${PLATFORM}"
          mkdir -p sysroot-out
          [ -d "$TC" ] || { echo "no toolchain produced"; exit 0; }
          cd "$TC"
          paths=""
          for p in "$T/include" "$T/lib" "lib/gcc/$T" "bin/cygwin1.dll"; do
            [ -e "$p" ] && paths="$paths $p"
          done
          [ -z "$paths" ] && { echo "nothing to package"; exit 0; }
          tar -czf "$GITHUB_WORKSPACE/sysroot-out/sysroot-$T.tar.gz" $paths
          cd "$GITHUB_WORKSPACE"
          sha256sum "sysroot-out/sysroot-$T.tar.gz" > "sysroot-out/sysroot-$T.tar.gz.sha256"
          ls -la sysroot-out/
          exit 0

      - name: Upload the sysroot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sysroot-aarch64-pc-cygwin
          path: sysroot-out/
          if-no-files-found: warn
          compression-level: 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-manifest
          path: out/
          if-no-files-found: warn
