# Cold bootstrap of the aarch64-pc-cygwin target libraries.
#
# NOT FOR UPSTREAM SUBMISSION.
#
# The sibling cygwin-cross workflow stops at "make all-gcc", which never
# touches libgcc or libstdc++ and so never exercises the libgcc/config.host
# hunk in the "Add aarch64-pc-cygwin target" patch.  This workflow does the
# full cross bootstrap from nothing:
#
#   1. binutils for the target
#   2. GCC stage 1 (compiler only, no target libraries)
#   3. Cygwin, cross-bootstrap mode, to lay down headers and libcygwin
#   4. libgcc, the first real test of the config.host hunk
#   5. Cygwin again, now that libgcc exists, for a complete cygwin1.dll
#   6. libstdc++
#
# Every local build so far reused a sysroot from the older GCC 15 stack, so
# this is the first genuinely cold bootstrap of the series.

name: cygwin target libraries

on:
  push:
    branches:
      - ci-target-libraries
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: target-libs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: aarch64-pc-cygwin target libraries
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 330
    env:
      TARGET: aarch64-pc-cygwin
      BINUTILS_REPO: https://github.com/dennisameling/binutils-gdb.git
      BINUTILS_REF: aarch64-pc-cygwin
      CYGWIN_REPO: https://github.com/eukarpov/cygwin-windows-arm64.git
      CYGWIN_REF: woarm64
      MINGW_REPO: https://github.com/Windows-on-ARM-Experiments/mingw-woarm64.git
      MINGW_REF: woarm64
      PREFIX: ${{ github.workspace }}/toolchain
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G

    steps:
      - name: Check out GCC
        uses: actions/checkout@v7
        with:
          path: gcc
          fetch-depth: 10

      - name: Show disk before
        run: df -h / | tail -1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ccache flex bison texinfo gperf \
            libgmp-dev libmpfr-dev libmpc-dev zlib1g-dev \
            autoconf automake libtool patch xz-utils perl

      - name: Resolve source revisions
        id: rev
        run: |
          bu=$(git ls-remote "$BINUTILS_REPO" "refs/heads/$BINUTILS_REF" | cut -f1)
          cy=$(git ls-remote "$CYGWIN_REPO"  "refs/heads/$CYGWIN_REF"  | cut -f1)
          test -n "$bu" && test -n "$cy"
          echo "binutils=$bu" >> "$GITHUB_OUTPUT"
          echo "cygwin=$cy"   >> "$GITHUB_OUTPUT"
          echo "binutils $bu"
          echo "cygwin   $cy"

      - name: Restore ccache
        uses: actions/cache@v6
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-libs-${{ github.sha }}
          restore-keys: |
            ccache-libs-

      - name: 1. Build binutils
        run: |
          # Deliberately not cached.  Caching $PREFIX would persist the whole
          # evolving sysroot between runs and make the bootstrap non-hermetic;
          # ccache already makes the recompile cheap.
          git clone --depth=1 --branch "$BINUTILS_REF" "$BINUTILS_REPO" binutils-src
          mkdir binutils-build && cd binutils-build
          ../binutils-src/configure --target="$TARGET" --prefix="$PREFIX" \
            --disable-nls --disable-werror --disable-sim \
            --disable-gdb --disable-gdbserver \
            CC="ccache gcc" CXX="ccache g++"
          make -j"$(nproc)"
          make install

      - name: 2. MinGW-w64 headers (w32api)
        run: |
          export PATH="$PREFIX/bin:$PATH"
          git clone --depth=1 --branch "$MINGW_REF" "$MINGW_REPO" mingw-src
          mkdir mingw-headers-build && cd mingw-headers-build
          ../mingw-src/mingw-w64-headers/configure \
            --prefix="$PREFIX/$TARGET" \
            --build="$(../mingw-src/mingw-w64-headers/config.guess 2>/dev/null || gcc -dumpmachine)" \
            --host="$TARGET" \
            --enable-sdk=all --enable-w32api
          make -j"$(nproc)" && make install
          test -f "$PREFIX/$TARGET/include/windows.h" \
            || test -f "$PREFIX/$TARGET/include/w32api/windows.h" \
            || { echo "windows.h not installed"; exit 1; }

      - name: 3. Cygwin headers
        run: |
          git clone --depth=1 --branch "$CYGWIN_REF" "$CYGWIN_REPO" cygwin-src
          mkdir -p "$PREFIX/$TARGET/include"
          cp -r cygwin-src/newlib/libc/include/*      "$PREFIX/$TARGET/include/"
          cp -r cygwin-src/winsup/cygwin/include/*    "$PREFIX/$TARGET/include/"
          test -f "$PREFIX/$TARGET/include/cygwin/config.h"
          echo "headers in sysroot: $(find "$PREFIX/$TARGET/include" -name '*.h' | wc -l)"

      - name: 4. GCC stage 1 (compiler only, --without-headers)
        run: |
          export PATH="$PREFIX/bin:$PATH"
          mkdir gcc-stage1 && cd gcc-stage1
          ../gcc/configure \
            --target="$TARGET" --prefix="$PREFIX" \
            --enable-languages=c,c++ \
            --enable-static --disable-shared --disable-bootstrap --disable-multilib \
            --disable-plugins --disable-gcov --disable-libatomic --disable-libgomp \
            --disable-libvtv --disable-libquadmath --disable-libssp --disable-nls \
            --with-gnu-as --with-gnu-ld --without-headers \
            CC="ccache gcc" CXX="ccache g++"
          make -j"$(nproc)" all-gcc
          make install-gcc

      - name: 5. MinGW-w64 CRT
        run: |
          export PATH="$PREFIX/bin:$PATH"
          mkdir mingw-crt-build && cd mingw-crt-build
          # --enable-w32api is required here as well as for the headers: with it
          # the headers land in include/w32api, and without it the CRT build
          # cannot find direct.h and friends.  The arm64 lib selection and the
          # msvcrt default mirror the mingw-woarm64 build scripts.
          ../mingw-src/mingw-w64-crt/configure \
            --prefix="$PREFIX/$TARGET" \
            --build="$(gcc -dumpmachine)" \
            --host="$TARGET" \
            --disable-lib32 --disable-lib64 --disable-libarm32 --enable-libarm64 \
            --enable-w32api \
            --with-default-msvcrt=msvcrt
          make -j"$(nproc)"
          make install
          # Cygwin expects the w32api import libraries visible directly in
          # $TARGET/lib, not only under w32api/.
          cd "$PREFIX/$TARGET/lib"
          for l in kernel32 user32 advapi32 shell32 gdi32 comdlg32 ntdll \
                   netapi32 psapi userenv dbghelp onecore pdh winmm; do
            [ -f "w32api/lib$l.a" ] && ln -fs "w32api/lib$l.a" . || true
          done
          ls -1 lib*.a 2>/dev/null | head -10

      - name: 6. Cygwin, stage 1
        run: |
          export PATH="$PREFIX/bin:$PATH"
          mkdir cygwin-build && cd cygwin-build
          ../cygwin-src/configure \
            --prefix="$PREFIX" \
            --build="$(gcc -dumpmachine)" --host="$(gcc -dumpmachine)" --target="$TARGET" \
            --enable-shared --enable-static --disable-doc --disable-dumper \
            --with-sysroot="$PREFIX" --with-build-sysroot="$PREFIX" \
            --with-cross-bootstrap --disable-cygserver --disable-utils
          make -j"$(nproc)" CFLAGS_FOR_TARGET="-Wno-error" \
            CXXFLAGS_FOR_TARGET="-Wno-error -Wno-narrowing -std=gnu++17"
          make install

      - name: 7. Full GCC (libgcc and libstdc++)
        run: |
          export PATH="$PREFIX/bin:$PATH"
          mkdir gcc-build && cd gcc-build
          ../gcc/configure \
            --target="$TARGET" --prefix="$PREFIX" \
            --enable-languages=c,c++ \
            --disable-bootstrap --disable-multilib --disable-nls \
            --enable-threads=posix --disable-shared \
            --with-sysroot="$PREFIX" \
            CC="ccache gcc" CXX="ccache g++"
          make -j"$(nproc)" all-target-libgcc
          make install-target-libgcc
          make -j"$(nproc)" all-target-libstdc++-v3
          make install-target-libstdc++-v3

      - name: Collect results
        if: always()
        run: |
          set +e
          mkdir -p out/logs out/libs
          {
            echo "target:   $TARGET"
            echo "gcc:      $(git -C gcc rev-parse HEAD)"
            echo "binutils: ${{ steps.rev.outputs.binutils }}"
            echo "cygwin:   ${{ steps.rev.outputs.cygwin }}"
            echo "runner:   $(uname -srm)"
          } > out/REVISIONS.txt
          git -C gcc log --oneline -10 > out/COMMITS.txt

          NM="$PREFIX/bin/$TARGET-nm"
          OD="$PREFIX/bin/$TARGET-objdump"
          {
            echo "=== artefacts ==="
            for f in \
              "$PREFIX"/lib/gcc/$TARGET/*/libgcc.a \
              "$PREFIX/$TARGET/lib/libstdc++.a" \
              "$PREFIX/$TARGET/lib/libcygwin.a" \
              "$PREFIX/bin/cygwin1.dll" ; do
              if [ -f "$f" ]; then
                printf '%-14s %12s bytes  %s\n' "$(basename "$f")" "$(stat -c %s "$f")" "$f"
                cp "$f" out/libs/ 2>/dev/null
              else
                echo "MISSING: $f"
              fi
            done
            echo
            echo "=== libgcc symbol count ==="
            for f in "$PREFIX"/lib/gcc/$TARGET/*/libgcc.a; do
              [ -f "$f" ] && echo "$(basename "$f"): $("$NM" "$f" 2>/dev/null | grep -c ' T ') text symbols"
            done
            echo
            echo "=== unwinder model (SEH vs SjLj) ==="
            for f in "$PREFIX"/lib/gcc/$TARGET/*/libgcc.a; do
              [ -f "$f" ] || continue
              echo "  _Unwind_SjLj_*: $("$NM" "$f" 2>/dev/null | grep -c '_Unwind_SjLj_')"
              echo "  _Unwind_RaiseException: $("$NM" "$f" 2>/dev/null | grep -c 'T _Unwind_RaiseException')"
            done
            echo
            echo "=== cygwin1.dll header ==="
            [ -f "$PREFIX/bin/cygwin1.dll" ] && "$OD" -f "$PREFIX/bin/cygwin1.dll" 2>/dev/null | head -12
          } > out/MANIFEST.txt 2>&1
          cat out/MANIFEST.txt

          cp gcc-build/config.log      out/logs/gcc-config.log      2>/dev/null
          cp gcc-stage1/config.log     out/logs/gcc-stage1-config.log 2>/dev/null
          cp cygwin-build/config.log   out/logs/cygwin-config.log   2>/dev/null
          df -h / | tail -1 > out/logs/disk.txt
          exit 0

      - name: Package the sysroot
        if: always()
        run: |
          set +e
          mkdir -p sysroot-out
          cd "$PREFIX"
          paths=""
          for p in "$TARGET/include" "$TARGET/lib" "lib/gcc/$TARGET" "bin/cygwin1.dll"; do
            [ -e "$p" ] && paths="$paths $p"
          done
          if [ -z "$paths" ]; then
            echo "nothing to package, the bootstrap did not get far enough"
            exit 0
          fi

          {
            echo "aarch64-pc-cygwin sysroot"
            echo
            echo "Built by the cygwin-target-libraries workflow from:"
            echo "  gcc:      $(git -C "$GITHUB_WORKSPACE/gcc" rev-parse HEAD)"
            echo "  binutils: ${{ steps.rev.outputs.binutils }}"
            echo "  cygwin:   ${{ steps.rev.outputs.cygwin }}"
            echo
            echo "Unpack over the --prefix of a matching cross toolchain:"
            echo "  tar -C \$PREFIX -xzf sysroot-$TARGET.tar.gz"
            echo
            echo "Then configure GCC with:"
            echo "  --target=$TARGET --with-sysroot=\$PREFIX"
            echo
            echo "Contents:"
          } > "$GITHUB_WORKSPACE/sysroot-out/README.txt"
          du -sh $paths >> "$GITHUB_WORKSPACE/sysroot-out/README.txt" 2>&1

          tar -czf "$GITHUB_WORKSPACE/sysroot-out/sysroot-$TARGET.tar.gz" $paths
          cd "$GITHUB_WORKSPACE"
          sha256sum "sysroot-out/sysroot-$TARGET.tar.gz" > "sysroot-out/sysroot-$TARGET.tar.gz.sha256"
          ls -la sysroot-out/
          cat sysroot-out/README.txt
          exit 0

      - name: Upload the sysroot
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sysroot-${{ env.TARGET }}
          path: sysroot-out/
          if-no-files-found: warn
          compression-level: 0

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: target-libraries-${{ env.TARGET }}
          path: out/
          if-no-files-found: warn

      - name: ccache statistics
        if: always()
        run: ccache -s | head -12
